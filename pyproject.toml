[project]
name = "fieldguard"
version = "0.1.0"
description = "Survey data-quality checks and fabrication detection (high-frequency checks) for KoboToolbox, ODK and SurveyCTO data."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Syed Hasnain", email = "syed.hasnain@dawoodfoundation.org" }
]
requires-python = ">=3.12"
keywords = [
    "survey",
    "data-quality",
    "high-frequency-checks",
    "monitoring-and-evaluation",
    "kobotoolbox",
    "odk",
    "surveycto",
    "fabrication-detection",
    "backchecks",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "httpx>=0.27",
    "numpy>=2.0",
    "pandas>=3.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "typer>=0.12",
]

[project.scripts]
fieldguard = "fieldguard.cli:main"

[project.optional-dependencies]
excel = [
    "openpyxl>=3.1",
    "xlsxwriter>=3.2",
]
html = [
    "jinja2>=3.1",
]
parquet = [
    "pyarrow>=15",
]
postgres = [
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
]
all = [
    "fieldguard[excel,html,parquet,postgres]",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fieldguard[all]",
    "bandit>=1.7",
    "detect-secrets>=1.5",
    "hypothesis>=6.100",
    "pip-audit>=2.7",
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "postgres: needs a reachable PostgreSQL (FIELDGUARD_DATABASE_URL); skipped otherwise",
    "slow: longer-running integration tests",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "NPY", "PT", "PIE"]
ignore = [
    "E501",   # long message strings are fine; the formatter handles code layout
    "PT011",  # broad pytest.raises(ValueError) is acceptable in tests
    "PT018",  # compound asserts in tests are deliberate: one property with its context per line
]
